services:
  - type: web
    name: fraudos-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fraudos-db
          property: connectionString
      - key: FRAUDOS_ENV
        value: production
      - key: FRAUDOS_TOKEN_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRAUDOS_ADMIN_PASSWORD
        sync: false
      - key: FRAUDOS_API_KEY
        generateValue: true

databases:
  - name: fraudos-db
    plan: free
